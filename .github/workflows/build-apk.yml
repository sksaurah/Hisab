name: Build Hisab APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Unpack project zip
        run: |
          ZIP=$(ls *.zip | head -1)
          echo "Using $ZIP"
          unzip -q -o "$ZIP" -d src
          PROJECT=$(dirname "$(find src -name settings.gradle.kts | head -1)")
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$PROJECT"
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Hisab.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hisab-apk
          path: Hisab.apk
