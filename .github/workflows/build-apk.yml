name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Put files into the right Android folders
        run: |
          M=app/src/main
          P=$M/java/com/inkcalc/app
          mkdir -p $P $M/res/layout $M/res/values $M/res/drawable $M/res/mipmap-anydpi-v26
          mvf() { if [ -f "$1" ]; then mv -f "$1" "$2"; fi; }
          for f in Calculator.kt CalcTileService.kt DrawingView.kt ExpressionNormalizer.kt InkRecognizer.kt MainActivity.kt; do mvf "$f" $P/; done
          mvf AndroidManifest.xml $M/
          for f in activity_main.xml key_button.xml; do mvf "$f" $M/res/layout/; done
          for f in strings.xml colors.xml themes.xml; do mvf "$f" $M/res/values/; done
          for f in canvas_bg.xml ic_tile.xml ic_launcher_foreground.xml; do mvf "$f" $M/res/drawable/; done
          for f in ic_launcher.xml ic_launcher_round.xml; do mvf "$f" $M/res/mipmap-anydpi-v26/; done
          mvf proguard-rules.pro app/
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          
          rootProject.name = "InkCalc"
          include(":app")
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          
          android {
              namespace = "com.inkcalc.app"
              compileSdk = 34
          
              defaultConfig {
                  applicationId = "com.inkcalc.app"
                  minSdk = 26          // Android 8.0+
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
          
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }
          
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              // Google ML Kit handwriting recognition (works offline after first model download)
              implementation("com.google.mlkit:digital-ink-recognition:18.1.0")
          }
          EOF
          if [ ! -f $M/AndroidManifest.xml ]; then
          cat > $M/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          
              <!-- Only needed once, to download the handwriting model -->
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.VIBRATE" />
          
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.InkCalc">
          
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:showWhenLocked="true"
                      android:turnScreenOn="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="unspecified"
                      android:windowSoftInputMode="stateAlwaysHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
          
                  <!-- Quick Settings tile: open the calculator from the lock screen -->
                  <service
                      android:name=".CalcTileService"
                      android:exported="true"
                      android:icon="@drawable/ic_tile"
                      android:label="@string/tile_label"
                      android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">
                      <intent-filter>
                          <action android:name="android.service.quicksettings.action.QS_TILE" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF
          fi
          echo "Project files:"
          find . -path ./.git -prune -o -type f -print | sort

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InkCalc-apk
          path: app/build/outputs/apk/debug/app-debug.apk
